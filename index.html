
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Date & Time Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock-container">
        <h1>Digital Clock</h1>
        <p class="subtitle">Your Live Date & Time</p>

        <div class="clock" id="clock">00:00:00 AM</div>

        <div class="date-box">
            <h2 id="day">Loading...</h2>
            <p id="date">Loading date...</p>
        </div>

        <p class="status">
            <span class="dot"></span> Live Clock
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
